<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin Satria Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#070B1C;--bg2:#0D1233;--card:#0F1636;--card2:#182050;--ink:#EEF1FF;--mute:#9AA4D4;--line:#29336E;--acc:#F2B33D;--accT:#F2B33D;--accInk:#1B1300;--ok:#34D399;--wt:#F59E0B;--red:#EF4B42;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media (prefers-color-scheme:light){:root{--bg:#F3F4FB;--bg2:#FBF3E2;--card:#fff;--card2:#EEF0FB;--ink:#12163A;--mute:#575C8A;--line:#D5D8EF;--acc:#F2A81D;--accT:#9A5B00;--ok:#0F8F5F;--wt:#B45309;--red:#C42B42}}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;min-height:100vh;color:var(--ink);font:500 15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(800px 360px at 90% -8%,#F2B33D22,transparent),radial-gradient(700px 420px at -10% 8%,#4B5CFF2c,transparent),linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed}
h1,h3,.ttl{font-family:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif}
h1,h3{margin:0 0 6px}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .12s,opacity .12s,background .12s}
button:active:not(:disabled){transform:scale(.97)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.w{max-width:780px;margin:0 auto;padding:14px 14px 90px}
.pn{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:20px}
.mu{color:var(--mute)}.sm{font-size:13px}
.top{display:flex;align-items:center;gap:12px;padding:6px 0}
.top>div:nth-child(2){flex:1;min-width:0}
.mk{flex:none;width:38px;height:44px;display:grid;place-items:center;font:800 15px "Bricolage Grotesque",sans-serif;color:var(--accInk);background:linear-gradient(160deg,#FFD878,#F2A81D 60%,#E8791A);clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);padding-bottom:6px}
.ttl{font-size:21px;font-weight:800;line-height:1.1}

/* statistik */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center;font-size:11.5px;font-weight:700;color:var(--mute);line-height:1.25}
.stats b{display:block;font:800 26px "Bricolage Grotesque",sans-serif;color:var(--accT);margin-bottom:2px}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}

/* tab menempel di atas */
.tabs{position:sticky;top:max(8px,env(safe-area-inset-top,0px));z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;margin-top:14px;box-shadow:0 8px 24px #0006}
.tab{border:0;background:none;border-radius:999px;padding:9px 4px;font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--acc);color:var(--accInk)}
.tab i{font-style:normal;font-size:15px}
.bdg{background:var(--red);color:#fff;border-radius:999px;font-size:10.5px;padding:0 6px;line-height:17px}
@media (max-width:420px){.tab span.lb{display:none}.tab[aria-pressed="true"] span.lb{display:inline}}

.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.fl{display:block;font-weight:700;margin:14px 0 6px}
.fi{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:14px;color:var(--ink);font:inherit;padding:12px 14px}
.fi:focus{outline:0;border-color:var(--acc)}
textarea.fi{min-height:90px;resize:vertical}
input[type=file].fi{padding:9px 10px}
input[type=file]::file-selector-button{border:0;border-radius:999px;background:var(--acc);color:var(--accInk);font:800 13px "Plus Jakarta Sans",sans-serif;padding:8px 14px;margin-right:10px;cursor:pointer}
.sr{margin-top:12px;border-radius:999px;padding:11px 18px}
.pb{border:0;border-radius:999px;background:var(--acc);color:var(--accInk);font-weight:800;padding:12px 18px}
.pb.wide{width:100%;margin-top:14px}
.ob{border:1px solid var(--line);border-radius:999px;background:none;font-weight:700;padding:10px 16px}
.ob.dg{color:var(--red);border-color:var(--red)}
.ob.sm2{padding:7px 13px;font-size:13px}
.pb:disabled,.ob:disabled{opacity:.6;cursor:wait}

/* kartu item */
.it{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;margin-top:10px}
.it.off{opacity:.62}
.th{flex:none;width:68px;height:68px;border-radius:14px;object-fit:cover;background:var(--card2);display:grid;place-items:center;font-size:28px}
.in{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.in b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr{color:var(--ok);font-weight:800}.pr s{color:var(--mute);font-weight:500}
.ac{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:520px){.it:not(.col){flex-wrap:wrap}.it:not(.col) .ac{width:100%;justify-content:flex-end}}
.tg{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:1px 9px;background:var(--card2);border:1px solid var(--line);color:var(--accT)}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;border:1px solid;white-space:nowrap}
.tag.ok{color:var(--ok)}.tag.wt{color:var(--wt)}.tag.red{color:var(--red)}.tag.off{color:var(--mute)}
.msg{color:var(--mute);font-size:13px;min-height:20px;margin:10px 0 0}
.ck{display:flex;gap:8px;align-items:center;margin:14px 0}
.ig,.phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px}
.ig:empty,.phs:empty{display:none}
.ph{position:relative;display:block;aspect-ratio:1;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:var(--card2)}
.ph.cv{border-color:var(--acc)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;width:26px;height:26px;border-radius:50%;border:0;background:#000c;color:#fff;font-size:13px;line-height:1}
.ph .rm{top:4px;right:4px}.ph .st{top:4px;left:4px}
.cvb{position:absolute;left:4px;bottom:4px;background:var(--acc);color:var(--accInk);font-size:10px;font-weight:800;border-radius:999px;padding:1px 8px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 2px;font:800 17px "Bricolage Grotesque","Plus Jakarta Sans",sans-serif;color:var(--accT)}
.tr{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;margin-top:8px}
.tr label{display:block;font-size:11px;font-weight:700;color:var(--mute);margin:0 0 3px}
.tr .fi{padding:9px 12px;border-radius:12px}
.tr .ca{display:flex;align-items:center;gap:6px;height:40px}
.tr .ca input{width:20px;height:20px;accent-color:var(--acc)}
.tr .ac{grid-column:1/-1}
@media (min-width:620px){.tr{grid-template-columns:1fr 1.3fr .7fr auto auto;align-items:end}.tr .ac{grid-column:auto;flex-wrap:nowrap}}

/* voucher */
.vc{flex:none;width:76px;min-height:68px;border-radius:14px;display:grid;place-items:center;text-align:center;padding:6px;font:800 19px/1.05 "Bricolage Grotesque",sans-serif;color:var(--accInk);background:linear-gradient(160deg,#FFD878,#F2A81D 70%,#E8791A);position:relative}
.vc small{display:block;font:800 10px "Plus Jakarta Sans",sans-serif;opacity:.8;margin-top:2px}
.vc.dead{background:var(--card2);color:var(--mute)}
.code{font:800 16px "Bricolage Grotesque",sans-serif;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.cp{border:1px solid var(--line);background:none;border-radius:999px;font-size:11px;font-weight:800;padding:1px 9px;color:var(--mute)}
.bar{height:6px;border-radius:999px;background:var(--card2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:999px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;padding:34px 14px;color:var(--mute)}
.empty b{display:block;font:800 17px "Bricolage Grotesque",sans-serif;color:var(--ink);margin-bottom:4px}

/* dialog + toast */
dialog{border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);padding:0;width:min(480px,calc(100vw - 20px));max-height:calc(100dvh - 20px);overflow:auto}
dialog::backdrop{background:#030618c0}
.db{padding:18px;display:grid;gap:4px}.db .ob{margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:50;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;padding:11px 20px;border-radius:999px;max-width:calc(100vw - 28px);text-align:center;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.er{background:var(--red);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="w" id="app"></div>
<dialog id="dlg"><div class="db" id="db"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const SUPABASE_URL="https://ntzbitqbmfrvyqyyeccr.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50emJpdHFibWZydnlxeXllY2NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MTM1ODAsImV4cCI6MjEwNzI4OTU4MH0.3kNZTecU4Si9WNjS7vrOGSZcGWnQRs104mcz93Q6Amk";

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp=n=>"Rp"+Number(n||0).toLocaleString("id-ID");
const fmt=s=>String(s||"").split(",").filter(Boolean).map(esc).join(", ");
const CATN={p:"Stok Akun",f:"Flash Sale",n:"Nokos",r:"Rental",t:"Partner"};
const CATE={p:"🛍️",f:"⚡",n:"📱",r:"💼",t:"🤝"};
const MAXI=7,MAXP=5;let proofs=[];
let tab="produk",pf="all",pq="",rf="wait",vf="all",PR=[],RE=[],TP=[],VC=[],tpErr="",vcErr="",imgs=[];
const imgsOf=p=>Array.isArray(p.images)&&p.images.length?p.images:(p.image_url?[p.image_url]:[]);
const ready=!SUPABASE_URL.includes("ISI_")&&!!window.supabase;
const sb=ready?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const say=h=>{$("app").innerHTML=h};
const brand=`<div class="top"><div class="mk" aria-hidden="true">SS</div><div><div class="ttl">Satria Store</div><div class="mu sm">Panel admin</div></div>`;

let tt;
function toast(t,bad){const e=$("toast");e.textContent=t;e.className="on"+(bad?" er":"");clearTimeout(tt);tt=setTimeout(()=>{e.className=""},bad?4200:2200)}

function loginView(msg=""){
 say(`${brand}</div><section class="pn"><h1>Masuk admin</h1><p class="mu">Pakai akun admin Supabase.</p>
 <form id="lf"><label class="fl" for="em">Email</label><input class="fi" id="em" type="email" autocomplete="username">
 <label class="fl" for="pw">Password</label><input class="fi" id="pw" type="password" autocomplete="current-password">
 <button class="pb" style="width:100%;margin-top:18px">Masuk</button></form><p class="msg" id="lm" role="status">${esc(msg)}</p></section>`);
 $("lf").onsubmit=async e=>{e.preventDefault();$("lm").textContent="Memeriksa…";
  const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(error)return $("lm").textContent="Gagal masuk: "+error.message;
  gate()}}
async function gate(){
 const {data:u}=await sb.auth.getUser();const uid=u&&u.user?u.user.id:"";
 const {data,error}=await sb.from("admins").select("user_id").eq("user_id",uid).limit(1);
 if(error||!data||!data.length){await sb.auth.signOut();return loginView(error?"Gagal cek admin: "+error.message:"Akun ini bukan admin (UID: "+uid+")")}
 await load();panel()}
async function load(){
 const [a,b,c,d]=await Promise.all([
  sb.from("products").select("*").order("id",{ascending:false}),
  sb.from("reports").select("*").order("id",{ascending:false}),
  sb.from("topups").select("*").order("sort").order("game").order("amount"),
  sb.from("vouchers").select("*").order("id",{ascending:false})]);
 PR=a.data||[];RE=b.data||[];TP=c.data||[];VC=d.data||[];
 tpErr=c.error?c.error.message:"";vcErr=d.error?d.error.message:""}

const vst=v=>{
 if(!v.active)return["Nonaktif","off"];
 if(v.expires_at&&new Date(v.expires_at)<new Date())return["Kedaluwarsa","red"];
 if(v.quota!=null&&v.used>=v.quota)return["Habis","red"];
 return["Aktif","ok"]};
const vOn=v=>vst(v)[1]==="ok";
const vVal=v=>v.kind==="pct"?v.value+"%":rp(v.value);

function panel(){
 const nw=RE.filter(r=>r.status==="wait").length,na=RE.filter(r=>r.status==="ok").length,nv=VC.filter(vOn).length;
 say(`${brand}<button class="ob" id="out">Keluar</button></div>
 <div class="stats"><div><b>${PR.length}</b>Produk</div><div><b>${nv}</b>Voucher aktif</div><div><b>${nw}</b>Laporan menunggu</div><div><b>${na}</b>Laporan disetujui</div></div>
 <div class="tabs" role="group" aria-label="Menu admin">
  <button class="tab" data-t="produk" aria-pressed="${tab==="produk"}"><i aria-hidden="true">🛍️</i><span class="lb">Produk</span></button>
  <button class="tab" data-t="topup" aria-pressed="${tab==="topup"}"><i aria-hidden="true">💎</i><span class="lb">Top Up</span></button>
  <button class="tab" data-t="voucher" aria-pressed="${tab==="voucher"}"><i aria-hidden="true">🎟️</i><span class="lb">Voucher</span></button>
  <button class="tab" data-t="laporan" aria-pressed="${tab==="laporan"}"><i aria-hidden="true">📋</i><span class="lb">Laporan</span>${nw?`<span class="bdg">${nw}</span>`:""}</button></div><div id="body"></div>`);
 $("out").onclick=async()=>{await sb.auth.signOut();loginView()};
 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.t;panel();window.scrollTo({top:0})});
 tab==="produk"?prodView():tab==="topup"?tuView():tab==="voucher"?vcView():repView()}

function prodView(){
 const cats=[["all","Semua",PR.length],...Object.entries(CATN).map(([k,n])=>[k,n,PR.filter(p=>p.category===k).length])];
 $("body").innerHTML=`<button class="pb wide" id="add">+ Tambah produk</button>
 <div class="chips">${cats.map(([k,n,c])=>`<button class="chip" data-pf="${k}" aria-pressed="${pf===k}">${n} (${c})</button>`).join("")}</div>
 <input class="fi sr" id="q" type="search" placeholder="Cari judul atau game…" aria-label="Cari produk" value="${esc(pq)}"><div id="pl"></div>`;
 $("add").onclick=()=>form(pf!=="all"?{category:pf,active:true}:null);
 $("body").querySelectorAll("[data-pf]").forEach(b=>b.onclick=()=>{pf=b.dataset.pf;prodView()});
 const draw=()=>{
  const s=pq.trim().toLowerCase();
  const list=PR.filter(p=>(pf==="all"||p.category===pf)&&(!s||(p.title+" "+(p.game||"")).toLowerCase().includes(s)));
  $("pl").innerHTML=list.map(p=>{const im=imgsOf(p);return `<div class="it${p.active?"":" off"}">${im[0]?`<img class="th" src="${esc(im[0])}" alt="" loading="lazy">`:`<div class="th" aria-hidden="true">${CATE[p.category]||"🎮"}</div>`}
  <div class="in"><b>${esc(p.title)}</b><span class="mu sm"><span class="tg">${CATN[p.category]||"-"}</span> ${esc(p.game||"")}${im.length>1?` · ${im.length} foto`:""}${p.active?"":" · disembunyikan"}${p.sold?' · <span class="tag red">SOLD</span>':""}</span><span class="pr">${p.category==="t"?"Partner":rp(p.price)}${p.old_price?` <s>${rp(p.old_price)}</s>`:""}</span></div>
  <div class="ac"><button class="ob${p.sold?"":" dg"}" data-sold="${p.id}">${p.sold?"Jual lagi":"Tandai SOLD"}</button><button class="ob" data-e="${p.id}">Edit</button><button class="ob dg" data-d="${p.id}">Hapus</button></div></div>`}).join("")||
  `<div class="empty"><b>${s?"Tidak ketemu":"Belum ada produk"}</b>${s?"Coba kata kunci lain.":"Tekan “+ Tambah produk” untuk mulai."}</div>`;
  $("pl").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>form(PR.find(p=>p.id==b.dataset.e)));
  $("pl").querySelectorAll("[data-sold]").forEach(b=>b.onclick=async()=>{
   const p=PR.find(x=>x.id==b.dataset.sold),ns=!p.sold;b.disabled=true;
   const {data,error}=await sb.from("products").update({sold:ns}).eq("id",p.id).select();
   if(error||!data||!data.length){b.disabled=false;return toast(error?"Gagal: "+error.message:"Tidak tersimpan. Pastikan akun ini terdaftar di tabel admins.",1)}
   await load();panel();toast(ns?"Ditandai SOLD":"Dijual lagi")});
  $("pl").querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{
   const p=PR.find(x=>x.id==b.dataset.d);
   if(!confirm("Hapus produk ini?"))return;
   const {error}=await sb.from("products").delete().eq("id",b.dataset.d);
   if(error)return toast("Gagal hapus: "+error.message,1);
   const paths=[...imgsOf(p),...(p.proof_images||[])].map(u=>u.split("/produk/")[1]).filter(Boolean);
   if(paths.length)sb.storage.from("produk").remove(paths).catch(()=>{});
   await load();panel();toast("Produk dihapus")})};
 $("q").oninput=()=>{pq=$("q").value;draw()};
 draw()}

function shrink(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(ok,"image/jpeg",.82)};
 im.onerror=()=>{URL.revokeObjectURL(u);no(new Error("File bukan gambar"))};im.src=u})}

function drawImgs(){const g=$("ig");if(!g)return;
 g.innerHTML=imgs.map((m,i)=>`<div class="ph${i?"":" cv"}"><img src="${esc(m.u)}" alt="Foto ${i+1}">${i?`<button type="button" class="st" data-c="${i}" aria-label="Jadikan sampul">★</button>`:`<span class="cvb">Sampul</span>`}<button type="button" class="rm" data-r="${i}" aria-label="Hapus foto ${i+1}">✕</button></div>`).join("");
 $("ic").textContent=imgs.length+"/"+MAXI+" foto";
 g.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const m=imgs[+b.dataset.r];if(!m.old)URL.revokeObjectURL(m.u);imgs.splice(+b.dataset.r,1);drawImgs()});
 g.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const [m]=imgs.splice(+b.dataset.c,1);imgs.unshift(m);drawImgs()})}

function drawProofs(){const g=$("pfg");if(!g)return;
 g.innerHTML=proofs.map((m,i)=>`<div class="ph"><img src="${esc(m.u)}" alt="Bukti ${i+1}"><button type="button" class="rm" data-pr="${i}" aria-label="Hapus bukti ${i+1}">✕</button></div>`).join("");
 $("pfc").textContent=proofs.length+"/"+MAXP+" foto";
 g.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>{const m=proofs[+b.dataset.pr];if(!m.old)URL.revokeObjectURL(m.u);proofs.splice(+b.dataset.pr,1);drawProofs()})}

function form(p){p=p||{category:"p",active:true};const v=k=>esc(p[k]??"");
 imgs=imgsOf(p).map(u=>({u,old:true}));
 proofs=(Array.isArray(p.proof_images)?p.proof_images:[]).map(u=>({u,old:true}));
 const LG={n:"Jenis nokos (mis. WhatsApp, Telegram)",t:"Keterangan partner (opsional)"};
 $("db").innerHTML=`<h3>${p.id?"Edit":"Tambah"} produk</h3>
 <label class="fl" for="f_c">Kategori</label><select class="fi" id="f_c">${Object.entries(CATN).map(([k,n])=>`<option value="${k}"${p.category===k?" selected":""}>${n}</option>`).join("")}</select>
 <label class="fl" for="f_t">Judul</label><input class="fi" id="f_t" maxlength="80" value="${v("title")}">
 <label class="fl" for="f_g" id="lg">Game</label><input class="fi" id="f_g" maxlength="40" value="${v("game")}">
 <label class="fl" for="f_s">Penjual</label><input class="fi" id="f_s" maxlength="40" value="${v("seller")}" placeholder="Satria Store">
 <label class="fl" for="f_p">Harga (Rp)</label><input class="fi" id="f_p" type="number" min="0" inputmode="numeric" value="${v("price")}">
 <label class="fl" for="f_o">Harga coret (opsional)</label><input class="fi" id="f_o" type="number" min="0" inputmode="numeric" value="${v("old_price")}">
 <label class="fl" for="f_d">Deskripsi</label><textarea class="fi" id="f_d" maxlength="600">${v("description")}</textarea>
 <label class="fl" for="f_i">Foto (maksimal ${MAXI})</label><input class="fi" id="f_i" type="file" accept="image/*" multiple>
 <p class="mu sm" style="margin:6px 0 0">Foto pertama jadi sampul. Tekan ★ untuk menjadikan foto lain sampul. <b id="ic">0/${MAXI} foto</b></p>
 <div class="ig" id="ig"></div>
 <label class="ck"><input type="checkbox" id="f_a"${p.active?" checked":""}> Tampilkan di toko</label>
 <label class="ck"><input type="checkbox" id="f_sold"${p.sold?" checked":""}> Tandai SOLD (tidak bisa dibeli)</label>
 <label class="fl" for="f_pf">Bukti terjual: chat atau bukti bayar (maksimal ${MAXP})</label>
 <input class="fi" id="f_pf" type="file" accept="image/*" multiple>
 <p class="mu sm" style="margin:6px 0 0">Tampil di halaman Akun terjual. Tutup nama, nomor HP, rekening, dan data pribadi sebelum diunggah. <b id="pfc">0/${MAXP} foto</b></p>
 <div class="ig" id="pfg"></div>
 <label class="fl" for="f_pl">Link bukti resmi (opsional)</label>
 <input class="fi" id="f_pl" type="url" inputmode="url" maxlength="300" placeholder="https://..." value="${v("proof_link")}">
 <p class="mu sm" style="margin:6px 0 0">Contoh: link postingan TikTok, saluran WhatsApp, atau testimoni yang menunjukkan transaksi ini.</p>
 <p class="msg" id="fm" role="status"></p><button class="pb" id="sv">Simpan</button><button class="ob" id="cx">Batal</button>`;
 const lab=()=>{$("lg").textContent=LG[$("f_c").value]||"Game";$("f_p").placeholder=$("f_c").value==="t"?"Boleh kosong":""};lab();$("f_c").onchange=lab;
 drawImgs();
 drawProofs();
 const close=()=>{imgs.concat(proofs).forEach(m=>{if(!m.old)URL.revokeObjectURL(m.u)});imgs=[];proofs=[];$("dlg").close()};
 $("cx").onclick=close;
 $("f_i").onchange=()=>{const fm=$("fm");fm.textContent="";
  for(const f of $("f_i").files){
   if(imgs.length>=MAXI){fm.textContent="Maksimal "+MAXI+" foto.";break}
   if(!f.type.startsWith("image/")){fm.textContent="Hanya file gambar yang bisa diunggah.";continue}
   imgs.push({f,u:URL.createObjectURL(f)})}
  $("f_i").value="";drawImgs()};
 $("f_pf").onchange=()=>{const fm=$("fm");fm.textContent="";
  for(const f of $("f_pf").files){
   if(proofs.length>=MAXP){fm.textContent="Maksimal "+MAXP+" foto bukti.";break}
   if(!f.type.startsWith("image/")){fm.textContent="Hanya file gambar yang bisa diunggah.";continue}
   proofs.push({f,u:URL.createObjectURL(f)})}
  $("f_pf").value="";drawProofs()};
 $("sv").onclick=async()=>{const fm=$("fm"),t=$("f_t").value.trim(),cat=$("f_c").value;
  const pr=$("f_p").value===""&&cat==="t"?0:parseInt($("f_p").value,10);
  if(!t||isNaN(pr)||pr<0)return fm.textContent="Judul dan harga wajib diisi.";
  let plink=$("f_pl").value.trim();
  if(plink&&!/^https?:\/\//i.test(plink))return fm.textContent="Link harus diawali http:// atau https://";
  $("sv").disabled=true;
  try{
   const urls=[];
   for(let i=0;i<imgs.length;i++){const m=imgs[i];
    if(m.old){urls.push(m.u);continue}
    fm.textContent="Mengunggah foto "+(i+1)+"/"+imgs.length+"…";
    const blob=await shrink(m.f),path=`p-${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
    const up=await sb.storage.from("produk").upload(path,blob,{contentType:"image/jpeg"});if(up.error)throw up.error;
    urls.push(sb.storage.from("produk").getPublicUrl(path).data.publicUrl)}
   const purls=[];
   for(let i=0;i<proofs.length;i++){const m=proofs[i];
    if(m.old){purls.push(m.u);continue}
    fm.textContent="Mengunggah bukti "+(i+1)+"/"+proofs.length+"…";
    const blob=await shrink(m.f),path=`b-${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
    const up=await sb.storage.from("produk").upload(path,blob,{contentType:"image/jpeg"});if(up.error)throw up.error;
    purls.push(sb.storage.from("produk").getPublicUrl(path).data.publicUrl)}
   fm.textContent="Menyimpan…";
   const row={title:t,game:$("f_g").value.trim()||null,category:cat,seller:$("f_s").value.trim()||null,price:pr,
    old_price:parseInt($("f_o").value,10)||null,description:$("f_d").value.trim()||null,images:urls,image_url:urls[0]||null,active:$("f_a").checked,sold:$("f_sold").checked,proof_images:purls,proof_link:plink||null};
   const r=p.id?await sb.from("products").update(row).eq("id",p.id):await sb.from("products").insert(row);if(r.error)throw r.error;
   close();await load();panel();toast("Produk tersimpan")
  }catch(e){fm.textContent="Gagal: "+e.message;$("sv").disabled=false}};
 $("dlg").showModal()}

function tuView(){
 const tm=(t,ok)=>{const m=$("tm");if(m){m.textContent=t;m.style.color=ok?"var(--ok)":"var(--red)"}if(t)toast(t,!ok)};
 const games=[...new Set(TP.map(r=>r.game))],secs=[...new Set(TP.map(r=>r.section).filter(Boolean))];
 const addForm=`<section class="pn" style="margin-top:14px"><h3>Tambah nominal top up</h3>
 <p class="mu sm" style="margin:0">Harga 0 = tampil "Tanya harga" di toko. Menulis nama game baru otomatis membuat kartu game baru. Urutan game: angka kecil tampil lebih dulu.</p>
 <label class="fl" for="n_g">Game</label><input class="fi" id="n_g" list="gl" maxlength="40" placeholder="Free Fire" autocomplete="off">
 <datalist id="gl">${games.map(g=>`<option value="${esc(g)}">`).join("")}</datalist>
 <label class="fl" for="n_u">Satuan</label><input class="fi" id="n_u" maxlength="20" placeholder="Diamond">
 <label class="fl" for="n_l">Nama paket (opsional)</label><input class="fi" id="n_l" maxlength="50" placeholder="Membership Mingguan">
 <p class="mu sm" style="margin:6px 0 0">Isi nama paket untuk item non-nominal (membership, pass, dll). Kalau diisi, satuan boleh kosong dan "Jumlah" dipakai sebagai nomor urutan di dalam game.</p>
 <label class="fl" for="n_sc">Bagian (opsional)</label><input class="fi" id="n_sc" list="sl" maxlength="30" placeholder="Memberships" autocomplete="off">
 <datalist id="sl">${secs.map(g=>`<option value="${esc(g)}">`).join("")}</datalist>
 <p class="mu sm" style="margin:6px 0 0">Bagian = judul kelompok di dalam popup game, misalnya Diamond, Memberships, Cards &amp; Passes. Kosongkan untuk nominal biasa (otomatis memakai satuan).</p>
 <label class="fl" for="n_a">Jumlah</label><input class="fi" id="n_a" type="number" min="1" inputmode="numeric" placeholder="70">
 <label class="fl" for="n_p">Harga (Rp)</label><input class="fi" id="n_p" type="number" min="0" inputmode="numeric" placeholder="10000">
 <label class="fl" for="n_s">Urutan game</label><input class="fi" id="n_s" type="number" inputmode="numeric" placeholder="1">
 <p class="msg" id="tm" role="status"></p><button class="pb" id="n_add">Tambah</button></section>`;
 let listHtml;
 if(tpErr)listHtml=`<section class="pn"><h3>Tabel top up belum siap</h3><p class="mu">Jalankan file topups.sql di Supabase (SQL Editor) dulu, lalu muat ulang halaman ini.</p><p class="mu sm">Detail: ${esc(tpErr)}</p></section>`;
 else if(!TP.length)listHtml=`<div class="empty"><b>Belum ada nominal</b>Tambahkan lewat form di atas.</div>`;
 else listHtml=games.map(g=>{const l=TP.filter(r=>r.game===g);
  return `<div class="gh"><span>${esc(g)}</span><button class="ob dg sm2" data-dg="${esc(g)}">Hapus game</button></div>`+
  l.map(r=>`<div class="tr" data-id="${r.id}">
   <div style="grid-column:1/-1"><label>Nama paket (kosongkan untuk nominal biasa)</label><input class="fi" maxlength="50" data-f="label" value="${esc(r.label||"")}"></div>
   <div style="grid-column:1/-1"><label>Bagian (mis. Diamond, Memberships, Cards &amp; Passes)</label><input class="fi" maxlength="30" data-f="section" value="${esc(r.section||"")}"></div>
   <div><label>Jumlah</label><input class="fi" type="number" min="1" inputmode="numeric" data-f="amount" value="${r.amount}"></div>
   <div><label>Harga (Rp)</label><input class="fi" type="number" min="0" inputmode="numeric" data-f="price" value="${r.price}"></div>
   <div><label>Urutan</label><input class="fi" type="number" inputmode="numeric" data-f="sort" value="${r.sort}"></div>
   <div><label>Tampil</label><div class="ca"><input type="checkbox" data-f="active"${r.active?" checked":""} aria-label="Tampilkan di toko"></div></div>
   <div class="ac"><button class="pb" data-s="${r.id}">Simpan</button><button class="ob dg" data-d="${r.id}">Hapus</button></div></div>`).join("")}).join("");
 $("body").innerHTML=addForm+listHtml;
 const refresh=async()=>{await load();tuView()};
 $("n_g").oninput=()=>{const r=TP.find(x=>x.game.toLowerCase()===$("n_g").value.trim().toLowerCase());
  if(r){if(!$("n_u").value)$("n_u").value=r.unit;if(!$("n_s").value)$("n_s").value=r.sort}};
 $("n_add").onclick=async()=>{
  const game=$("n_g").value.trim(),unit=$("n_u").value.trim(),label=$("n_l").value.trim(),section=$("n_sc").value.trim(),amount=parseInt($("n_a").value,10),price=parseInt($("n_p").value||"0",10),sort=parseInt($("n_s").value||"0",10);
  if(!game||(!unit&&!label)||!(amount>0)||isNaN(price)||price<0||isNaN(sort))return tm("Isi game, satuan, jumlah (lebih dari 0), dan harga dengan benar.");
  $("n_add").disabled=true;
  const {data,error}=await sb.from("topups").insert({game,unit,amount,price,sort,label:label||null,section:section||null}).select();
  $("n_add").disabled=false;
  if(error)return tm("Gagal tambah: "+error.message);
  if(!data||!data.length)return tm("Tidak tersimpan. Pastikan akun ini terdaftar di tabel admins.");
  await refresh();tm("Ditambahkan.",true)};
 $("body").querySelectorAll("[data-s]").forEach(b=>b.onclick=async()=>{
  const el=b.closest(".tr"),f=k=>el.querySelector(`[data-f="${k}"]`);
  const amount=parseInt(f("amount").value,10),price=parseInt(f("price").value||"0",10),sort=parseInt(f("sort").value||"0",10);
  if(!(amount>0)||isNaN(price)||price<0||isNaN(sort))return tm("Jumlah harus lebih dari 0 dan harga tidak boleh minus.");
  b.disabled=true;
  const {data,error}=await sb.from("topups").update({amount,price,sort,label:f("label").value.trim()||null,section:f("section").value.trim()||null,active:f("active").checked}).eq("id",b.dataset.s).select();
  b.disabled=false;
  if(error)return tm("Gagal simpan: "+error.message);
  if(!data||!data.length)return tm("Tidak tersimpan. Pastikan akun ini terdaftar di tabel admins.");
  await refresh();tm("Tersimpan.",true)});
 $("body").querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{
  if(!confirm("Hapus nominal ini?"))return;
  const {data,error}=await sb.from("topups").delete().eq("id",b.dataset.d).select();
  if(error)return toast("Gagal: "+error.message,1);
  if(!data||!data.length)return toast("Tidak terhapus. Pastikan akun ini terdaftar di tabel admins.",1);
  await refresh();toast("Nominal dihapus")});
 $("body").querySelectorAll("[data-dg]").forEach(b=>b.onclick=async()=>{
  if(!confirm("Hapus SEMUA nominal "+b.dataset.dg+"?"))return;
  const {data,error}=await sb.from("topups").delete().eq("game",b.dataset.dg).select();
  if(error)return toast("Gagal: "+error.message,1);
  if(!data||!data.length)return toast("Tidak terhapus. Pastikan akun ini terdaftar di tabel admins.",1);
  await refresh();toast("Game dihapus")})}

function vcView(){
 if(vcErr){$("body").innerHTML=`<section class="pn" style="margin-top:14px"><h3>Tabel voucher belum siap</h3><p class="mu">Jalankan file vouchers.sql di Supabase (SQL Editor) dulu, lalu muat ulang halaman ini.</p><p class="mu sm">Detail: ${esc(vcErr)}</p></section>`;return}
 const cnt=k=>k==="all"?VC.length:VC.filter(v=>k==="on"?vOn(v):!vOn(v)).length;
 const list=VC.filter(v=>vf==="all"||(vf==="on"?vOn(v):!vOn(v)));
 $("body").innerHTML=`<button class="pb wide" id="vadd">+ Buat voucher</button>
 <div class="chips">${[["all","Semua"],["on","Aktif"],["off","Tidak aktif"]].map(([k,n])=>`<button class="chip" data-vf="${k}" aria-pressed="${vf===k}">${n} (${cnt(k)})</button>`).join("")}</div>`+
 (list.map(v=>{const [sl,sc]=vst(v),dead=sc!=="ok";
  const pct=v.quota?Math.min(100,Math.round(v.used/v.quota*100)):0;
  const info=[v.kind==="pct"&&v.max_discount?"maks "+rp(v.max_discount):"",v.min_order?"min. belanja "+rp(v.min_order):"",v.expires_at?"sampai "+new Date(v.expires_at).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"}):"tanpa batas waktu"].filter(Boolean).join(" · ");
  return `<div class="it${dead?" off":""}"><div class="vc${dead?" dead":""}" aria-hidden="true"><div>${esc(vVal(v))}<small>${v.kind==="pct"?"DISKON":"POTONGAN"}</small></div></div>
  <div class="in"><span class="code">${esc(v.code)}<button class="cp" data-cp="${esc(v.code)}" aria-label="Salin kode ${esc(v.code)}">Salin</button></span>
   <span class="mu sm">${esc(info)}</span>
   <span class="mu sm"><span class="tag ${sc}">${sl}</span> Terpakai ${v.used||0}${v.quota?" dari "+v.quota:" kali"}${v.note?" · "+esc(v.note):""}</span>
   ${v.quota?`<div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>`:""}</div>
  <div class="ac"><button class="ob" data-ve="${v.id}">Edit</button><button class="ob" data-vt="${v.id}">${v.active?"Matikan":"Aktifkan"}</button><button class="ob dg" data-vd="${v.id}">Hapus</button></div></div>`}).join("")||
  `<div class="empty"><b>${VC.length?"Tidak ada voucher di sini":"Belum ada voucher"}</b>${VC.length?"Ganti filter di atas.":"Tekan “+ Buat voucher” untuk membuat kode diskon pertama."}</div>`);
 $("vadd").onclick=()=>vform(null);
 $("body").querySelectorAll("[data-vf]").forEach(b=>b.onclick=()=>{vf=b.dataset.vf;vcView()});
 $("body").querySelectorAll("[data-ve]").forEach(b=>b.onclick=()=>vform(VC.find(v=>v.id==b.dataset.ve)));
 $("body").querySelectorAll("[data-cp]").forEach(b=>b.onclick=async()=>{
  try{await navigator.clipboard.writeText(b.dataset.cp);toast("Kode "+b.dataset.cp+" disalin")}catch(e){toast("Tidak bisa menyalin otomatis",1)}});
 $("body").querySelectorAll("[data-vt]").forEach(b=>b.onclick=async()=>{
  const v=VC.find(x=>x.id==b.dataset.vt);b.disabled=true;
  const {data,error}=await sb.from("vouchers").update({active:!v.active}).eq("id",v.id).select();
  if(error||!data||!data.length){b.disabled=false;return toast(error?"Gagal: "+error.message:"Tidak tersimpan. Pastikan akun ini terdaftar di tabel admins.",1)}
  await load();panel();toast(v.active?"Voucher dimatikan":"Voucher diaktifkan")});
 $("body").querySelectorAll("[data-vd]").forEach(b=>b.onclick=async()=>{
  const v=VC.find(x=>x.id==b.dataset.vd);
  if(!confirm("Hapus voucher "+v.code+"?"))return;
  const {data,error}=await sb.from("vouchers").delete().eq("id",v.id).select();
  if(error)return toast("Gagal: "+error.message,1);
  if(!data||!data.length)return toast("Tidak terhapus. Pastikan akun ini terdaftar di tabel admins.",1);
  await load();panel();toast("Voucher dihapus")})}

const toLocalDT=iso=>{if(!iso)return"";const d=new Date(iso),z=n=>String(n).padStart(2,"0");
 return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+"T"+z(d.getHours())+":"+z(d.getMinutes())};
const rndCode=()=>{const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<8;i++)s+=a[Math.floor(Math.random()*a.length)];return s};

function vform(p){p=p||{kind:"pct",active:true,min_order:0};const v=k=>esc(p[k]??"");
 $("db").innerHTML=`<h3>${p.id?"Edit":"Buat"} voucher</h3>
 <label class="fl" for="v_c">Kode voucher</label>
 <div style="display:flex;gap:8px"><input class="fi" id="v_c" maxlength="20" autocomplete="off" autocapitalize="characters" placeholder="HEMAT10" value="${v("code")}" style="text-transform:uppercase"><button type="button" class="ob" id="v_r">Acak</button></div>
 <p class="mu sm" style="margin:6px 0 0">Huruf, angka, strip (-) atau garis bawah (_), 3–20 karakter. Huruf besar/kecil dianggap sama.</p>
 <div class="row2"><div><label class="fl" for="v_k">Jenis potongan</label><select class="fi" id="v_k"><option value="pct"${p.kind==="pct"?" selected":""}>Persen (%)</option><option value="nom"${p.kind==="nom"?" selected":""}>Nominal (Rp)</option></select></div>
 <div><label class="fl" for="v_v" id="lv">Besar diskon (%)</label><input class="fi" id="v_v" type="number" min="1" inputmode="numeric" value="${v("value")}"></div></div>
 <div id="v_mx"><label class="fl" for="v_m">Maksimal potongan (Rp, opsional)</label><input class="fi" id="v_m" type="number" min="1" inputmode="numeric" placeholder="Kosong = tanpa batas" value="${v("max_discount")}"></div>
 <label class="fl" for="v_o">Minimal belanja (Rp)</label><input class="fi" id="v_o" type="number" min="0" inputmode="numeric" placeholder="0" value="${p.min_order?v("min_order"):""}">
 <div class="row2"><div><label class="fl" for="v_q">Kuota pemakaian</label><input class="fi" id="v_q" type="number" min="1" inputmode="numeric" placeholder="Tanpa batas" value="${v("quota")}"></div>
 <div><label class="fl" for="v_e">Berlaku sampai</label><input class="fi" id="v_e" type="datetime-local" value="${toLocalDT(p.expires_at)}"></div></div>
 ${p.id?`<p class="mu sm" style="margin:6px 0 0">Sudah terpakai: <b>${p.used||0}</b> kali.${p.quota?"":""}</p>`:""}
 <label class="fl" for="v_n">Catatan internal (opsional)</label><input class="fi" id="v_n" maxlength="80" placeholder="Mis. promo gajian" value="${v("note")}">
 <label class="ck"><input type="checkbox" id="v_a"${p.active?" checked":""}> Voucher aktif</label>
 <p class="msg" id="fm" role="status"></p><button class="pb" id="sv">Simpan</button><button class="ob" id="cx">Batal</button>`;
 const kind=()=>{const pc=$("v_k").value==="pct";$("lv").textContent=pc?"Besar diskon (%)":"Besar potongan (Rp)";$("v_mx").style.display=pc?"":"none";$("v_v").max=pc?100:"";$("v_v").placeholder=pc?"10":"5000"};
 kind();$("v_k").onchange=kind;
 $("v_r").onclick=()=>{$("v_c").value=rndCode()};
 $("cx").onclick=()=>$("dlg").close();
 $("sv").onclick=async()=>{const fm=$("fm");
  const code=$("v_c").value.trim().toUpperCase(),k=$("v_k").value,val=parseInt($("v_v").value,10);
  const mx=parseInt($("v_m").value,10)||null,mo=parseInt($("v_o").value||"0",10),q=$("v_q").value===""?null:parseInt($("v_q").value,10);
  const ev=$("v_e").value,ex=ev?new Date(ev):null;
  if(!/^[A-Z0-9_-]{3,20}$/.test(code))return fm.textContent="Kode harus 3–20 karakter: huruf, angka, - atau _.";
  if(!(val>0))return fm.textContent="Besar diskon harus lebih dari 0.";
  if(k==="pct"&&val>100)return fm.textContent="Diskon persen maksimal 100.";
  if(isNaN(mo)||mo<0)return fm.textContent="Minimal belanja tidak boleh minus.";
  if(q!==null&&!(q>0))return fm.textContent="Kuota harus lebih dari 0, atau kosongkan.";
  if(ex&&isNaN(ex.getTime()))return fm.textContent="Tanggal berlaku tidak valid.";
  if(VC.some(x=>x.id!==p.id&&x.code.toUpperCase()===code))return fm.textContent="Kode "+code+" sudah dipakai voucher lain.";
  $("sv").disabled=true;fm.textContent="Menyimpan…";
  const row={code,kind:k,value:val,max_discount:k==="pct"?mx:null,min_order:mo,quota:q,expires_at:ex?ex.toISOString():null,note:$("v_n").value.trim()||null,active:$("v_a").checked};
  const r=p.id?await sb.from("vouchers").update(row).eq("id",p.id).select():await sb.from("vouchers").insert(row).select();
  if(r.error){$("sv").disabled=false;return fm.textContent=r.error.code==="23505"?"Kode "+code+" sudah dipakai voucher lain.":"Gagal: "+r.error.message}
  if(!r.data||!r.data.length){$("sv").disabled=false;return fm.textContent="Tidak tersimpan. Pastikan akun ini terdaftar di tabel admins."}
  $("dlg").close();await load();panel();toast(p.id?"Voucher diperbarui":"Voucher dibuat")};
 $("dlg").showModal()}

async function repView(){
 const cnt=k=>k==="all"?RE.length:RE.filter(r=>r.status===k).length;
 const list=RE.filter(r=>rf==="all"||r.status===rf);
 $("body").innerHTML=`<div class="chips">${[["wait","Menunggu"],["ok","Disetujui"],["all","Semua"]].map(([k,n])=>`<button class="chip" data-rf="${k}" aria-pressed="${rf===k}">${n} (${cnt(k)})</button>`).join("")}</div>`+
 (list.map(r=>{const ps=r.proof_paths||[];return `<div class="it col" style="flex-direction:column;align-items:stretch">
  <div><span class="tag ${r.status==="ok"?"ok":"wt"}">${r.status==="ok"?"DISETUJUI":"MENUNGGU"}</span> <b>#${r.id} ${esc(r.title)}</b></div>
  <div class="mu">WA pelaku: ${fmt(r.wa)}${r.game_id?"<br>ID game: "+fmt(r.game_id):""}</div>
  ${r.story?`<p class="mu" style="margin:4px 0">${esc(r.story)}</p>`:""}
  <div class="mu sm">${r.created_at?new Date(r.created_at).toLocaleString("id-ID"):""}</div>
  ${ps.length?`<div class="phs" data-rid="${r.id}"><span class="mu sm">Memuat foto…</span></div>`:r.proof_url?`<div class="phs"><a class="ph" href="${esc(r.proof_url)}" target="_blank" rel="noopener"><img src="${esc(r.proof_url)}" alt="Foto bukti"></a></div>`:`<p class="mu sm" style="margin:4px 0">Tanpa foto bukti.</p>`}
  <div class="ac" style="margin-top:6px">${r.status==="wait"?`<button class="pb" data-a="ok" data-id="${r.id}">Setujui</button>`:""}<button class="ob dg" data-a="del" data-id="${r.id}">Hapus</button></div></div>`}).join("")||`<div class="empty"><b>Tidak ada laporan di sini</b>Laporan baru dari pengunjung akan muncul di tab ini.</div>`);
 $("body").querySelectorAll("[data-rf]").forEach(b=>b.onclick=()=>{rf=b.dataset.rf;repView()});
 $("body").querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{const id=b.dataset.id,r=RE.find(x=>x.id==id);let q;
  if(b.dataset.a==="ok"){
   if(!confirm("Setujui laporan ini? Laporan dan foto buktinya akan tampil di publik. Pastikan foto tidak memuat data pribadi pelapor."))return;
   q=sb.from("reports").update({status:"ok"}).eq("id",id)}
  else{if(!confirm("Hapus laporan ini beserta foto buktinya?"))return;q=sb.from("reports").delete().eq("id",id)}
  const {error}=await q;if(error)return toast("Gagal: "+error.message,1);
  if(b.dataset.a==="del"&&r&&(r.proof_paths||[]).length)sb.storage.from("bukti").remove(r.proof_paths).catch(()=>{});
  const wasOk=b.dataset.a==="ok";
  await load();panel();toast(wasOk?"Laporan disetujui":"Laporan dihapus")});
 const paths=[...new Set(list.flatMap(r=>r.proof_paths||[]))];
 if(paths.length){
  const {data}=await sb.storage.from("bukti").createSignedUrls(paths,3600);
  const mp={};(data||[]).forEach(x=>{if(x.signedUrl)mp[x.path]=x.signedUrl});
  list.forEach(r=>{const box=$("body")&&$("body").querySelector(`[data-rid="${r.id}"]`);if(!box)return;
   box.innerHTML=(r.proof_paths||[]).map((p,i)=>mp[p]?`<a class="ph" href="${esc(mp[p])}" target="_blank" rel="noopener" aria-label="Buka foto bukti ${i+1}"><img src="${esc(mp[p])}" alt="Foto bukti ${i+1}" loading="lazy"></a>`:"").join("")||`<span class="mu sm">Foto tidak bisa dimuat. Cek policy storage untuk admin.</span>`})}}

if(!ready)say(`${brand}</div><section class="pn"><h1>Belum tersambung</h1><p class="mu">Isi SUPABASE_URL dan SUPABASE_KEY di bagian atas admin.html.</p></section>`);
else sb.auth.getSession().then(({data})=>data.session?gate():loginView());
</script>
</body>
</html>
