<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin Top Up — Satria Store</title>
<style>
:root{--bg:#0B1220;--card:#121B30;--card2:#19243F;--ink:#EEF2FA;--mute:#9AA7C2;--line:#27355A;--acc:#F2B33D;--onf:#1A1204;--ok:#3BD79C;--red:#F0566A;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px 14px 60px}
.w{max-width:760px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--mute);font-size:13px}
.pn{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;padding:10px 12px}
input:focus{outline:0;border-color:var(--acc)}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--acc)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:10px 14px;font-weight:800}
button.pr{background:var(--acc);border-color:var(--acc);color:var(--onf)}
button.dn{color:var(--red)}
button:disabled{opacity:.6}
.g5{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.g5{grid-template-columns:repeat(5,1fr)}}
.gh{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;font-weight:800;color:var(--acc)}
.r{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;background:var(--card2)}
@media(min-width:620px){.r{grid-template-columns:1fr 1.3fr .7fr auto auto auto;align-items:end}}
.r label{margin:0 0 3px;font-size:11px;color:var(--mute)}
.ck{display:flex;align-items:center;gap:6px;height:42px}
.msg{min-height:20px;font-size:13px;margin-top:10px}
.ok{color:var(--ok)}.er{color:var(--red)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
[hidden]{display:none!important}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div class="w">
 <div class="top"><div><h1>Admin Top Up</h1><p class="sub">Atur nominal dan harga top up Satria Store.</p></div><button id="out" hidden>Keluar</button></div>

 <section class="pn" id="login">
  <h2>Masuk admin</h2>
  <label for="em">Email</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <p class="msg er" id="lm" role="status"></p>
  <button class="pr" id="li" style="width:100%">Masuk</button>
 </section>

 <div id="app" hidden>
  <section class="pn">
   <h2>Tambah nominal</h2>
   <div class="g5">
    <div><label for="ng">Game</label><input id="ng" list="gl" placeholder="Free Fire"></div>
    <div><label for="nu">Satuan</label><input id="nu" placeholder="Diamond"></div>
    <div><label for="na">Jumlah</label><input id="na" type="number" inputmode="numeric" min="1" placeholder="70"></div>
    <div><label for="np">Harga (Rp)</label><input id="np" type="number" inputmode="numeric" min="0" placeholder="10000"></div>
    <div><label for="ns">Urutan game</label><input id="ns" type="number" inputmode="numeric" placeholder="1"></div>
   </div>
   <datalist id="gl"></datalist>
   <p class="sub" style="margin-top:8px">Harga 0 = tampil "Tanya harga" di toko. Urutan game: angka kecil tampil lebih dulu. Game baru (misalnya Genshin) otomatis muncul sebagai kartu baru.</p>
   <button class="pr" id="ad" style="margin-top:10px">Tambah</button>
  </section>
  <p class="msg" id="m" role="status"></p>
  <div id="list"></div>
 </div>
</div>

<script>
const SUPABASE_URL="https://ntzbitqbmfrvyqyyeccr.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50emJpdHFibWZydnlxeXllY2NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MTM1ODAsImV4cCI6MjEwNzI4OTU4MH0.3kNZTecU4Si9WNjS7vrOGSZcGWnQRs104mcz93Q6Amk";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let rows=[];
function say(t,ok){const m=$("m");m.textContent=t;m.className="msg "+(ok?"ok":"er")}

async function boot(){
 const {data}=await sb.auth.getSession();
 const on=!!data.session;
 $("login").hidden=on;$("app").hidden=!on;$("out").hidden=!on;
 if(on)load()}
$("li").onclick=async()=>{const b=$("li");b.disabled=true;$("lm").textContent="";
 const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
 b.disabled=false;
 if(error){$("lm").textContent="Gagal masuk: "+error.message;return}
 $("pw").value="";boot()};
$("out").onclick=async()=>{await sb.auth.signOut();rows=[];boot()};

async function load(){
 const {data,error}=await sb.from("topups").select("*").order("sort").order("game").order("amount");
 if(error){say("Gagal memuat: "+error.message+" (sudah menjalankan topups.sql di Supabase?)");return}
 rows=data;draw()}

function draw(){
 const games=[...new Set(rows.map(r=>r.game))];
 $("gl").innerHTML=games.map(g=>`<option value="${esc(g)}">`).join("");
 if(!rows.length){$("list").innerHTML=`<p class="sub" style="margin-top:14px">Belum ada nominal. Tambahkan lewat form di atas.</p>`;return}
 $("list").innerHTML=games.map(g=>{
  const l=rows.filter(r=>r.game===g);
  return `<div class="gh"><span>${esc(g)} · ${esc(l[0].unit)}</span><button class="dn" data-dg="${esc(g)}">Hapus game</button></div>`+
  l.map(r=>`<div class="r" data-id="${r.id}">
   <div><label>Jumlah</label><input type="number" inputmode="numeric" min="1" data-f="amount" value="${r.amount}"></div>
   <div><label>Harga (Rp)</label><input type="number" inputmode="numeric" min="0" data-f="price" value="${r.price}"></div>
   <div><label>Urutan</label><input type="number" inputmode="numeric" data-f="sort" value="${r.sort}"></div>
   <div><label>Tampil</label><div class="ck"><input type="checkbox" data-f="active" ${r.active?"checked":""}></div></div>
   <button class="pr" data-s="${r.id}">Simpan</button>
   <button class="dn" data-d="${r.id}">Hapus</button></div>`).join("")}).join("");
 $("list").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>save(+b.dataset.s,b));
 $("list").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>del(+b.dataset.d));
 $("list").querySelectorAll("[data-dg]").forEach(b=>b.onclick=()=>delGame(b.dataset.dg))}

async function save(id,btn){
 const el=document.querySelector(`.r[data-id="${id}"]`),v=f=>el.querySelector(`[data-f="${f}"]`);
 const amount=parseInt(v("amount").value,10),price=parseInt(v("price").value||"0",10),sort=parseInt(v("sort").value||"0",10);
 if(!(amount>0)||price<0||isNaN(price)||isNaN(sort)){say("Jumlah harus lebih dari 0 dan harga tidak boleh minus.");return}
 btn.disabled=true;
 const {data,error}=await sb.from("topups").update({amount,price,sort,active:v("active").checked}).eq("id",id).select();
 btn.disabled=false;
 if(error)return say("Gagal simpan: "+error.message);
 if(!data||!data.length)return say("Tidak tersimpan. Pastikan akun ini terdaftar di tabel admins.");
 say("Tersimpan.",true);load()}

async function del(id){
 if(!confirm("Hapus nominal ini?"))return;
 const {data,error}=await sb.from("topups").delete().eq("id",id).select();
 if(error)return say("Gagal hapus: "+error.message);
 if(!data||!data.length)return say("Tidak terhapus. Pastikan akun ini terdaftar di tabel admins.");
 say("Terhapus.",true);load()}

async function delGame(g){
 if(!confirm("Hapus SEMUA nominal "+g+"?"))return;
 const {data,error}=await sb.from("topups").delete().eq("game",g).select();
 if(error)return say("Gagal hapus: "+error.message);
 if(!data||!data.length)return say("Tidak terhapus. Pastikan akun ini terdaftar di tabel admins.");
 say("Game dihapus.",true);load()}

$("ng").oninput=()=>{const r=rows.find(x=>x.game.toLowerCase()===$("ng").value.trim().toLowerCase());
 if(r){if(!$("nu").value)$("nu").value=r.unit;if(!$("ns").value)$("ns").value=r.sort}};
$("ad").onclick=async()=>{
 const game=$("ng").value.trim(),unit=$("nu").value.trim(),amount=parseInt($("na").value,10),price=parseInt($("np").value||"0",10),sort=parseInt($("ns").value||"0",10);
 if(!game||!unit||!(amount>0)||isNaN(price)||price<0||isNaN(sort)){say("Isi game, satuan, jumlah (lebih dari 0), dan harga dengan benar.");return}
 const b=$("ad");b.disabled=true;
 const {data,error}=await sb.from("topups").insert({game,unit,amount,price,sort}).select();
 b.disabled=false;
 if(error)return say("Gagal tambah: "+error.message);
 if(!data||!data.length)return say("Tidak tersimpan. Pastikan akun ini terdaftar di tabel admins.");
 $("na").value="";$("np").value="";say("Ditambahkan.",true);load()};
sb.auth.onAuthStateChange(()=>{});
boot();
</script>
</body>
</html>
